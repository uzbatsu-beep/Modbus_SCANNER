name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend (cargo check + tests)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # generate_context!() requires the frontendDist path to exist.
      # A real bundle is produced by the frontend job; this stub is enough for
      # backend-only checks (dist/ is intentionally gitignored).
      - name: Prepare frontend dist placeholder
        run: node -e "require('fs').mkdirSync('dist',{recursive:true});require('fs').writeFileSync('dist/index.html','<!doctype html>')"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 / wry system dependencies on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Verify generated IPC bindings are up to date
        working-directory: src-tauri
        run: |
          cargo run --bin gen_bindings
          git -C .. diff --exit-code -- src/types/generated

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  # Full installers are built on release tags to keep CI fast.
