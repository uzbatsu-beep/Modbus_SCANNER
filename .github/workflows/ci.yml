name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Explicit full platform validation on final candidate; never publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Governance (release gate tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release gate positive and negative cases
        run: node --test scripts/verify-release-gates.test.mjs
      - name: Verify all package/Cargo/Tauri versions
        run: node scripts/check-release-version.mjs
      - name: Check Markdown cross-references and link-checker tests
        run: npm run docs:check
      - name: Verify importable ruleset JSON parses and has expected targets
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const main = JSON.parse(readFileSync('.github/rulesets/main.json', 'utf8'));
          const tags = JSON.parse(readFileSync('.github/rulesets/release-tags.json', 'utf8'));
          if (main.target !== 'branch' || tags.target !== 'tag' ||
              main.enforcement !== 'active' || tags.enforcement !== 'active') {
            throw new Error('ruleset templates are malformed');
          }
          "

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:identity
      - run: npm run test:measurement
      - run: npm run test:workbench
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend (cargo check + tests) (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # generate_context!() requires the frontendDist path to exist.
      # A real bundle is produced by the frontend job; this stub is enough for
      # backend-only checks (dist/ is intentionally gitignored).
      - name: Prepare frontend dist placeholder
        run: node -e "require('fs').mkdirSync('dist',{recursive:true});require('fs').writeFileSync('dist/index.html','<!doctype html>')"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Verify generated IPC bindings are up to date
        working-directory: src-tauri
        run: |
          cargo run --bin gen_bindings
          git -C .. diff --exit-code -- src/types/generated

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Protocol smoke — loopback Modbus field simulator
        working-directory: src-tauri
        run: cargo test --lib scanner::field_tests -- --nocapture

  backend-linux:
    name: Backend (cargo check + tests) (ubuntu-latest)
    # Keep the existing required check context; skipped on routine PR/push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # generate_context!() requires the frontendDist path to exist.
      # A real bundle is produced by the frontend job; this stub is enough for
      # backend-only checks (dist/ is intentionally gitignored).
      - name: Prepare frontend dist placeholder
        run: node -e "require('fs').mkdirSync('dist',{recursive:true});require('fs').writeFileSync('dist/index.html','<!doctype html>')"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 / wry system dependencies on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Verify generated IPC bindings are up to date
        working-directory: src-tauri
        run: |
          cargo run --bin gen_bindings
          git -C .. diff --exit-code -- src/types/generated

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Protocol smoke — loopback Modbus field simulator
        working-directory: src-tauri
        run: cargo test --lib scanner::field_tests -- --nocapture

  backend-macos:
    name: Backend (cargo check + tests) (macos-latest)
    # Keep the existing required check context; skipped on routine PR/push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # generate_context!() requires the frontendDist path to exist.
      # A real bundle is produced by the frontend job; this stub is enough for
      # backend-only checks (dist/ is intentionally gitignored).
      - name: Prepare frontend dist placeholder
        run: node -e "require('fs').mkdirSync('dist',{recursive:true});require('fs').writeFileSync('dist/index.html','<!doctype html>')"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Verify generated IPC bindings are up to date
        working-directory: src-tauri
        run: |
          cargo run --bin gen_bindings
          git -C .. diff --exit-code -- src/types/generated

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Protocol smoke — loopback Modbus field simulator
        working-directory: src-tauri
        run: cargo test --lib scanner::field_tests -- --nocapture

  # Installers are tested separately by Windows QA and promoted by a
  # manual, protected Release workflow after physical bench acceptance.
