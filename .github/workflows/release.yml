name: Release (manual, verified)

# Deliberately NO push.tags trigger: creating a tag alone must NEVER publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact version tag, e.g. v1.0.1'
        required: true
        type: string
      qa_run_id:
        description: 'Successful Windows QA run on the exact HEAD of main'
        required: true
        type: string
      bench_passed:
        description: 'Physical isolated Modbus bench acceptance passed'
        required: true
        default: false
        type: boolean
      bench_evidence_url:
        description: 'Repository issue with source SHA and Bench result: PASS'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release gate (CI, QA, Rulesets, bench)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify manifest versions
        run: node scripts/check-release-version.mjs
      - name: Verify release-gate implementation tests
        run: node --test scripts/verify-release-gates.test.mjs
      - name: Verify main SHA, Rulesets, main-push and full three-platform CI, QA and bench Issue
        run: node scripts/verify-release-gates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          BENCH_PASSED: ${{ inputs.bench_passed }}
          BENCH_EVIDENCE_URL: ${{ inputs.bench_evidence_url }}

  build-windows:
    name: Release installers (EXE + MSI)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Locked frontend install
        run: npm ci
      - name: Verify manifests
        run: node scripts/check-release-version.mjs
      - name: Build frontend before Rust tests
        run: npm run build
      - name: Rust regression tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build Windows NSIS and MSI installers
        run: npm run tauri build -- --bundles nsis,msi
      - name: Stage exactly two installers and SHA256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") })
          if ($files.Count -ne 2 -or @($files | Where-Object Extension -eq ".exe").Count -ne 1 -or
              @($files | Where-Object Extension -eq ".msi").Count -ne 1) {
            throw "Expected exactly one EXE and one MSI; got $($files.Count)"
          }
          New-Item -ItemType Directory -Force release-dist | Out-Null
          $hashes = @()
          foreach ($file in $files) {
            if (-not $file.Name.Contains("_$version")) {
              throw "Installer version mismatch: $($file.Name) vs $version"
            }
            Copy-Item $file.FullName "release-dist/$($file.Name)"
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$hash  $($file.Name)"
          }
          $hashes | Set-Content release-dist/SHA256SUMS.txt -Encoding utf8
          @(
            "Modbus Scanner release candidate - source: ${{ github.sha }}"
            "Version: $version"
            "QA run: ${{ inputs.qa_run_id }}"
            "Bench evidence: ${{ inputs.bench_evidence_url }}"
            "Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ) | Set-Content release-dist/BUILD-INFO.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: release-installers-verified
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish (manual release with verified gates)
    needs: [preflight, build-windows]
    runs-on: ubuntu-latest
    # No second-person Environment approval: the maintainer manually starts
    # workflow_dispatch. Re-run all gates before creating a new release.
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recheck gates immediately before publishing
        run: node scripts/verify-release-gates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          BENCH_PASSED: ${{ inputs.bench_passed }}
          BENCH_EVIDENCE_URL: ${{ inputs.bench_evidence_url }}
      - uses: actions/download-artifact@v4
        with:
          name: release-installers-verified
          path: release-dist
      - name: Validate shipped assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-dist -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-dist -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 1
          cd release-dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable release tag and Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            Source commit: ${{ github.sha }}
            Windows QA run: ${{ inputs.qa_run_id }}
            Bench acceptance: ${{ inputs.bench_evidence_url }}
            Published by manual workflow_dispatch after CI, QA and bench sign-off gates.
          files: |
            release-dist/*.exe
            release-dist/*.msi
            release-dist/SHA256SUMS.txt
            release-dist/BUILD-INFO.txt
          fail_on_unmatched_files: true
