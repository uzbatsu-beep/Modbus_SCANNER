[package]
name = "modbus-scanner"
version = "0.1.1"
description = "Modbus RTU/ASCII/TCP/UDP scanner - cross-platform desktop tool"
authors = ["uzbatsu-beep <uzbatsu@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/uzbatsu-beep/Modbus_SCANNER"
homepage = "https://github.com/uzbatsu-beep/Modbus_SCANNER#readme"
edition = "2021"
rust-version = "1.77"

[lib]
name = "modbus_scanner_lib"
# NOTE: cdylib/staticlib are needed for Tauri mobile; on the gnu toolchain
# they break `cargo test` (STATUS_ENTRYPOINT_NOT_FOUND), so enable on demand:
#   cargo build --features mobile-libs
# crate-type = ["staticlib", "cdylib", "rlib"]
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
rand = "0.8"
parking_lot = "0.12"
async-trait = "0.1"

[features]
# by default Tauri runs in production mode
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
